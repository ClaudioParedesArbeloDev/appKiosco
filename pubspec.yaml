name: app_kiosco
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.11.0
  flutter_riverpod: ^3.3.2
  flutter_secure_storage: ^10.3.1
  google_sign_in: ^7.2.0
  url_launcher: ^6.3.2
  flutter_dotenv: ^6.0.1
  mobile_scanner: ^7.4.0
  dart_pusher_channels: ^1.3.1
  qr_flutter: ^4.1.0
  audioplayers: ^6.1.0
  file_picker: ^11.0.3
  uuid: ^4.5.3
  drift: ^2.28.0
  drift_flutter: ^0.2.7
  connectivity_plus: ^6.1.5
  path_provider: ^2.1.5
  device_info_plus: ^12.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.28.0
  build_runner: ^2.7.1
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21
  windows:
    generate: true
    image_path: "assets/images/app_icon.png"
    icon_size: 256

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
    - assets/lottie/
    - assets/audio/
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
    - family: FiraCode
      fonts:
        - asset: assets/fonts/FiraCode-Regular.ttf
          weight: 400
